name: CI

# `test` runs the build + validation suite on every PR and push. `deploy` runs
# only on pushes to main and only after `test` passes, so the SEO-invariant
# suite (see tests/README.md) is a hard gate on production: broken code cannot
# reach doubletrends.com.
#
# Requires two repo secrets for the deploy job:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit on this account
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id (not in wrangler.jsonc)
# Cloudflare's own Git auto-deploy must be turned OFF so this is the only
# deploy path (otherwise the site deploys twice, ungated).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Node version CI builds and deploys with; package.json `engines` is the
# oldest that works.
env:
  NODE_VERSION: 24

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The build screenshots the primary-nav pages (scripts/build-screenshots.js)
      # with the Chromium version package-lock.json pins.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test # only deploys if the suite passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The build screenshots the primary-nav pages (scripts/build-screenshots.js)
      # with the Chromium version package-lock.json pins.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
