name: CI

# Runs the build + validation suite on every PR and on pushes to main.
# The suite (see tests/README.md) guards the SEO invariants — link integrity,
# canonical/metadata/schema correctness, page-registry and nav/heading
# consistency — so a regression is caught before it can reach production.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth for the Node version
          cache: npm

      - run: npm ci
      - run: npm test
