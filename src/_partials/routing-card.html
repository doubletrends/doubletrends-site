<section class="w-full" style="background: transparent;">
<div class="home-container max-w-site mx-auto px-8 py-20">
<div class="max-w-5xl mx-auto hover-lift-rust overflow-hidden" style="background: linear-gradient(135deg, #171D25 0%, #222B36 58%, #2C3641 100%); box-shadow: 0 28px 80px rgba(23,29,37,0.18);">
<div class="flex flex-col lg:flex-row lg:items-stretch">
<div class="flex-1 px-8 py-9 md:px-10 md:py-10 lg:px-12 lg:py-11" style="border-right: 1px solid rgba(255,255,255,0.10);">
<div class="flex items-center gap-3 flex-wrap mb-5">
<span class="data-label" style="color: rgba(255,255,255,0.64); letter-spacing: 0.18em;">NEXT COMMAND</span>
<span class="font-mono text-[11px] px-3 py-1" style="color: #FFD7BF; background: rgba(194,65,12,0.18); border: 1px solid rgba(194,65,12,0.28);">{{ROUTING_PILL}}</span>
</div>
<h2 class="text-3xl md:text-4xl lg:text-[3.15rem] font-noto font-bold leading-[1.02] mb-4" style="color: #F6F1E8;">{{ROUTING_HEADLINE}}</h2>
<p class="font-open text-base md:text-lg leading-relaxed max-w-2xl" style="color: rgba(233,237,242,0.82);">{{ROUTING_BODY}}</p>
</div>
<div class="lg:w-[22rem] px-8 py-9 md:px-10 md:py-10 lg:px-10 lg:py-11 flex flex-col justify-between" style="background: rgba(255,255,255,0.04);">
<div>
<span class="data-label" style="color: rgba(255,255,255,0.56);">Route</span>
<p class="font-mono text-sm mt-2" style="color: #F6F1E8;">{{ROUTING_ROUTE}}</p>
<p class="font-open text-sm leading-relaxed mt-4" style="color: rgba(233,237,242,0.72);">{{ROUTING_ROUTE_DESC}}</p>
</div>
<div class="mt-8">
<a href="{{ROUTING_HREF}}" class="btn-light inline-flex items-center gap-3" style="padding-right: 1.1rem;"><span>{{ROUTING_CTA}}</span><span aria-hidden="true" style="font-size: 1.05rem;">&rarr;</span></a>
<p class="data-label mt-4" style="color: rgba(255,255,255,0.46);">{{ROUTING_FOOTER_LABEL}}</p>
</div>
</div>
</div>
</div>
</div>
</section>
