  <style>
    /* Nav bar glass (via ::before so children can use their own backdrop-filter) */
    .site-header::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(255,255,255,0.80);
      -webkit-backdrop-filter: blur(35px) saturate(1.6);
      backdrop-filter: blur(35px) saturate(1.6);
    }

    .nav-plain-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5A6473;
      padding: 0.5rem 1rem;
      background: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s ease;
    }
    .nav-plain-link:hover { color: #1E2530; }
    .nav-chevron {
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .nav-dropdown {
      position: relative;
    }
    .nav-dropdown:hover .nav-chevron,
    .nav-dropdown:focus-within .nav-chevron {
      transform: rotate(180deg);
    }
    .nav-dropdown-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: rgba(255,255,255,0.80);
      -webkit-backdrop-filter: blur(35px) saturate(1.6);
      backdrop-filter: blur(35px) saturate(1.6);
      border: 1px solid rgba(30,37,48,0.10);
      box-shadow: 0 10px 20px rgba(30,37,48,0.10);
      min-width: 220px;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0.18s;
    }
    .nav-dropdown--right .nav-dropdown-panel {
      left: auto;
      right: 0;
    }
    /* Invisible bridge closes the 4px gap so mousing into the panel doesn't dismiss it */
    .nav-dropdown-panel::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 0;
      right: 0;
      height: 6px;
    }
    .nav-dropdown:hover .nav-dropdown-panel,
    .nav-dropdown:focus-within .nav-dropdown-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s 0s;
    }
    .nav-dropdown-index {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #1E2530;
      padding: 0.75rem 1.25rem 0.65rem;
      border-bottom: 1px solid rgba(30,37,48,0.08);
      transition: color 0.12s;
    }
    .nav-dropdown-index:hover { color: #C2410C; }
    .nav-dropdown-section {
      padding: 0.5rem 0;
      border-top: 1px solid rgba(30,37,48,0.06);
    }
    .nav-dropdown-section:first-of-type { border-top: none; }
    .nav-dropdown-label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5A6473;
      padding: 0.4rem 1.25rem 0.2rem;
    }
    .nav-dropdown-item {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      color: #5A6473;
      padding: 0.35rem 1.25rem;
      white-space: nowrap;
      transition: color 0.12s, background 0.10s;
    }
    .nav-dropdown-item:hover {
      color: #1E2530;
      background: rgba(30,37,48,0.03);
    }
  </style>
