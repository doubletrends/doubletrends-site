<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />
  <meta name="author" content="Cheng's Data Service" />
  <meta name="application-name" content="DoubleTrends™" />
  <meta name="robots" content="{{ROBOTS}}" />
  <meta name="theme-color" content="#FBFAF7" />

  <!-- Open Graph -->
  <meta property="og:type"        content="{{OG_TYPE}}" />
  <meta property="og:site_name"   content="DoubleTrends™" />
  <meta property="og:url"         content="{{CANONICAL}}" />
  <meta property="og:title"       content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:image"       content="{{OG_IMAGE}}" />
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}" />
  <meta property="og:image:type"  content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"   content="{{OG_IMAGE_ALT}}" />
  <meta property="og:locale"      content="en_US" />
{{SOCIAL_EXTRA}}

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESC}}" />
  <meta name="twitter:image"       content="{{OG_IMAGE}}" />
  <meta name="twitter:image:alt"   content="{{OG_IMAGE_ALT}}" />

  <!-- Canonical -->
  <link rel="canonical" href="{{CANONICAL}}" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ROOT}}public/brand/cds-favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ROOT}}public/brand/cds-favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ROOT}}public/brand/cds-favicon-180.png" />

  <!-- Structured data -->
  <script type="application/ld+json">
{{JSONLD}}
  </script>

{{FONTS}}
{{TAILWIND}}
{{STYLES}}</head>
