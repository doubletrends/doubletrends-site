<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="{{CANONICAL}}" />
  <meta property="og:title"       content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:image"       content="https://doubletrends.com/public/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESC}}" />

  <!-- Canonical -->
  <link rel="canonical" href="{{CANONICAL}}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ROOT}}public/cds logo black-200h.png" />

  <!-- Fonts: Syne (display) + DM Sans (body) + JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;600&family=Merriweather:wght@300;400&display=swap" />

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:     '#E05A00',
            'primary-h': '#FF6A10',
            dark:        '#080809',
            light:       '#F5F3EF',
            muted:       '#A8BCCC',
            'muted-dim': '#7A8CA0',
            bright:      '#C8DCFF',
            'gray-d':    '#D0D0D0',
          },
          fontFamily: {
            /* Remapped — existing class names preserved for all other pages */
            noto:  ['"Syne"', 'sans-serif'],
            open:  ['"DM Sans"', 'sans-serif'],
            exo:   ['"DM Sans"', 'sans-serif'],
            mono:  ['"JetBrains Mono"', 'monospace'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          },
          maxWidth: {
            site: '1200px',
            hero: '1000px',
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* ── Text gradients ─────────────────────────────────────────── */
    .text-grad-hero {
      background-image: linear-gradient(160deg, #ffffff 10%, #909090 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .text-grad-section {
      background-image: linear-gradient(140deg, #ffffff 0%, #5a5a5a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Buttons — sharp, precise, no radius ────────────────────── */
    .btn-light {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #080809;
      background: #F5F3EF;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.8rem 1.75rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-light:hover { background: #ffffff; transform: translateY(-1px); }

    .btn-dark {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #C8C8C8;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.8rem 1.75rem;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    .btn-dark:hover {
      border-color: rgba(255,255,255,0.45);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* ── Accordion ──────────────────────────────────────────────── */
    details[open] summary .acc-icon { transform: rotate(180deg); }
    .acc-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out; }
    details[open] + .acc-content { max-height: 1000vh; }

    /* ── Footer wave overlay ────────────────────────────────────── */
    .footer-wave {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.12;
      pointer-events: none;
    }

    /* ── Code block ─────────────────────────────────────────────── */
    .code-block {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.75rem;
      background: #0C0C0F;
      color: #7BBFEF;
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.06);
      overflow-x: auto;
      white-space: pre-wrap;
    }

    /* ── Data / terminal typography ─────────────────────────────── */
    .data-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7A8CA0;
    }
    .data-value {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 2.25rem;
      color: #F5F3EF;
      line-height: 1;
    }

    /* ── Structural utilities ───────────────────────────────────── */
    .hairline   { border-top:  1px solid rgba(255,255,255,0.06); }
    .hairline-v { border-left: 1px solid rgba(255,255,255,0.06); }
    .card-border { border: 1px solid rgba(255,255,255,0.07); }

    /* ── Dot-grid background ────────────────────────────────────── */
    .dot-grid {
      background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── Overline / category tag ─────────────────────────────────── */
    .tag-overline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #E87030;
    }
  </style>
</head>
