<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Critical resources first: the stylesheet and the faces above the fold
       (Source Serif 4 600 headings, 400 ledes; Source Sans 3 400 text, 500 nav, 600
       top bar and labels). crossorigin is required even same-origin: font
       fetches are CORS-mode. Fonts and site.css are cached long-term
       (scripts/build-cache.js), so these matter on a first visit only. -->
  <link rel="preload" href="{{ROOT}}public/fonts/source-serif-4/source-serif-4-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ROOT}}public/fonts/source-serif-4/source-serif-4-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ROOT}}public/fonts/source-sans-3/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ROOT}}public/fonts/source-sans-3/source-sans-3-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ROOT}}public/fonts/source-sans-3/source-sans-3-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="{{ROOT}}public/styles/site.css" />
  <!-- First paint waits for the house faces, so text never shows in a
       fallback face and then swaps (the flash on a first visit). Cached faces
       resolve at once; on a slow first load the page shows after 1.2 s
       whatever has arrived. Without JS or the Font Loading API nothing waits. -->
  <style>.fonts-wait body { visibility: hidden; }</style>
  <script>(function(d){var r=d.documentElement,f=d.fonts;if(!f||!f.load)return;r.classList.add('fonts-wait');function done(){r.classList.remove('fonts-wait')}Promise.all(['600 1em "Source Serif 4"','400 1em "Source Serif 4"','400 1em "Source Sans 3"','500 1em "Source Sans 3"','600 1em "Source Sans 3"'].map(function(s){return f.load(s)})).then(done,done);setTimeout(done,1200)})(document);</script>

  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />
  <meta name="author" content="{{LEGAL_NAME}}" />
  <meta name="application-name" content="{{SITE_NAME}}" />
  <meta name="robots" content="{{ROBOTS}}" />
  <meta name="theme-color" content="{{THEME_COLOR}}" />

  <!-- Open Graph -->
  <meta property="og:type"        content="{{OG_TYPE}}" />
  <meta property="og:site_name"   content="{{SITE_NAME}}" />
  <meta property="og:url"         content="{{CANONICAL}}" />
  <meta property="og:title"       content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:image"       content="{{OG_IMAGE}}" />
  <meta property="og:image:secure_url" content="{{OG_IMAGE}}" />
  <meta property="og:image:type"  content="image/png" />
  <meta property="og:image:width" content="{{OG_IMAGE_WIDTH}}" />
  <meta property="og:image:height" content="{{OG_IMAGE_HEIGHT}}" />
  <meta property="og:image:alt"   content="{{OG_IMAGE_ALT}}" />
  <meta property="og:locale"      content="en_US" />
{{SOCIAL_EXTRA}}

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESC}}" />
  <meta name="twitter:image"       content="{{OG_IMAGE}}" />
  <meta name="twitter:image:alt"   content="{{OG_IMAGE_ALT}}" />

  <!-- Canonical -->
  <link rel="canonical" href="{{CANONICAL}}" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ROOT}}public/brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ROOT}}public/brand/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ROOT}}public/brand/favicon-180.png" />

  <!-- Structured data (non-critical, last) -->
{{JSONLD_SCRIPTS}}
</head>
